<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    .btn {
      background: cyan;
      padding: 10px;
      margin: 10px;
      display: inline-block;
      color: black;
      text-decoration: none;
    }

    .loader {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: black;
      box-shadow: 0 0 30px cyan inset;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
    }

    .loader::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      background: cyan;
      border-radius: 50%;
      left: -100px;
      animation: move 2s linear infinite;
    }

    @keyframes move {
      0% { left: -100px; }
      100% { left: 100px; }
    }
  </style>
</head>

<body>

<h1>🌘 Eclipse Test</h1>

<div class="loader"></div>

<div id="countdown"></div>

<a class="btn" href="#">Home</a>
<a class="btn" href="#">Live</a>
<a class="btn" href="#">Shop</a>

<script>
  const target = new Date("Aug 12, 2026 10:30:00").getTime();

  setInterval(() => {
    const now = new Date().getTime();
    const diff = target - now;

    const s = Math.floor(diff / 1000);
    document.getElementById("countdown").innerHTML = s + " seconds";
  }, 1000);
</script>

</body>
</html>
